# Self-contained oauth2-proxy + ExGoCD demo
# Uses real quay.io/oauth2-proxy/oauth2-proxy image with htpasswd auth.
# The sign-in page at /oauth2/sign_in shows a username/password form
# (validated against htpasswd.txt) alongside a Google button (ignored).
# Basic auth via curl also works: curl -u admin@exgocd.local:admin123 ...
#
# Test users (from htpasswd.txt):
#   admin@exgocd.local / admin123  → gets admin role
#   dev@exgocd.local   / dev123    → gets developer role

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3-arm64
    container_name: exgocd-oauth2-proxy
    ports:
      - "4180:4180"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "http://host.docker.internal:4000"
      OAUTH2_PROXY_COOKIE_SECRET: "Z29vZC1zZWNyZXQtY29vaA=="
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_DOMAINS: "localhost"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Dummy Google provider (required in v7). The button appears on sign-in
      # page but is harmless — users use the htpasswd form instead.
      OAUTH2_PROXY_PROVIDER: "google"
      OAUTH2_PROXY_CLIENT_ID: "dummy"
      OAUTH2_PROXY_CLIENT_SECRET: "dummy"
      # htpasswd auth — validated against htpasswd.txt
      OAUTH2_PROXY_HTPASSWD_FILE: "/etc/oauth2-proxy/htpasswd.txt"
      OAUTH2_PROXY_HTPASSWD_USER_GROUP: "admin@exgocd.local=admin;dev@exgocd.local=developer"
      # Pass user identity headers to backend
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Whitelist API/health paths (no auth required)
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "GET=^/api/version|GET=^/api/agents|POST=^/api/agents/register|GET=^/health"
    volumes:
      - ./htpasswd.txt:/etc/oauth2-proxy/htpasswd.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ExGoCD server — runs on host (mix phx.server, port 4000).
  # Access: http://localhost:4180 (unauthenticated redirects to /oauth2/sign_in)
  #   or: curl -u admin@exgocd.local:admin123 http://localhost:4180/
