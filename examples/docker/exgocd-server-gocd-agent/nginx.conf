# nginx reverse proxy for Example 3: ex_gocd server + official GoCD Java agent
#
# Proxies all requests to the ex_gocd Phoenix server.
# /go/admin/ paths serve GoCD agent JAR files from /jars/ via try_files.
# try_files serves files for GET/HEAD and falls through to proxy for POST,
# so POST /go/admin/agent (registration) reaches the ex_gocd server.
# MD5 values are hex-encoded (lowercase), matching DownloadableFile.matchChecksum().

map $uri $agent_content_md5 {
    /go/admin/agent-launcher.jar "5b3dfd695b37d54975b01d7467562dcc";
    /go/admin/agent.jar           "08ba8de18606fe2cdd4ebc3822477864";
    /go/admin/agent               "08ba8de18606fe2cdd4ebc3822477864";
    /go/admin/tfs-impl.jar        "6463759483aaae008cd9b77a85d37a87";
    /go/admin/agent-plugins.zip   "429c33c4a20108b8aab1025dd1269dfb";
    default                       "";
}

server {
    listen 80;

    # Serve GoCD agent JARs from /jars/ tree (matches URL path structure).
    # try_files serves the file for GET/HEAD; POST to existing files returns 405
    # which error_page redirects to @backend. Non-existent files fall through to @backend.
    location /go/admin/ {
        root /jars;
        add_header Content-MD5 $agent_content_md5 always;
        error_page 405 = @backend;
        try_files $uri @backend;
    }

    # Everything else → ex_gocd Phoenix server
    location / {
        proxy_pass http://ex-gocd-server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @backend {
        proxy_pass http://ex-gocd-server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
