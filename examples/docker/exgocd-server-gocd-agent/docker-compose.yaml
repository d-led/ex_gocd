# Example 3: ex_gocd server with official GoCD Java agent
#
# Our Phoenix server + nginx reverse proxy + official gocd/gocd-agent-alpine container.
# nginx serves GoCD agent JARs (agent-launcher.jar, agent.jar, etc.) from local
# ./jars/ and proxies everything else to the ex_gocd server.
# The Java agent bootstrapper downloads JARs from GO_SERVER_URL/admin/.
# Access ex_gocd dashboard at http://localhost:4003

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ex_gocd_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ex-gocd-server:
    image: ghcr.io/d-led/ex_gocd:latest
    build:
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "/app/bin/ex_gocd eval 'ExGoCD.Release.migrate()' && /app/bin/ex_gocd start"
    environment:
      DATABASE_URL: "ecto://postgres:postgres@postgres/ex_gocd_prod"
      SECRET_KEY_BASE: "demo-secret-key-base-do-not-use-in-production"
      PHX_HOST: "localhost"
      PORT: "4000"
    volumes:
      - exgocd_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/version"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - '4003:80'
    depends_on:
      ex-gocd-server:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./jars:/jars:ro

  gocd-java-agent:
    image: gocd/gocd-agent-alpine:v25.4.0
    depends_on:
      - nginx
    environment:
      GO_SERVER_URL: "http://nginx:80/go"
      AGENT_AUTO_REGISTER_KEY: "ex-gocd-demo-cookie"
      AGENT_AUTO_REGISTER_RESOURCES: "java,alpine"
      AGENT_AUTO_REGISTER_ENVIRONMENTS: "staging"

volumes:
  pgdata:
  exgocd_artifacts:
