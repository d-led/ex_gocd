# Quickstart: a server, a database, a fleet of agents and the demo pipelines.
#
#   curl -fsSLO https://raw.githubusercontent.com/d-led/ex_gocd/main/docker-compose.quickstart.yml
#   docker compose -f docker-compose.quickstart.yml up --build
#
# Open http://localhost:4000 — no login: GoCD's open mode means no admin user
# exists, so every visitor is an admin. That is why the server starts with
# EX_GOCD_SKIP_USER_SEED=1: the seed script's demo users would end open mode.
#
# This is the "see it run" file. docker-compose.yml is the development one (Jaeger,
# Grafana, Loki, k3s) and is deliberately separate.

name: ex-gocd-quickstart

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ex_gocd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ex_gocd"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      # Postgres 18 keeps its data in a version subdirectory of this path, so
      # this is the mount point the image asks for.
      - db:/var/lib/postgresql

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/ex_gocd
      # Demo value, not a secret: this file is for a laptop, not a deployment.
      # Plug refuses a key shorter than 64 bytes, and then every page that
      # touches a cookie is a 500, so this one is exactly 64.
      SECRET_KEY_BASE: cJumB9kRIRyLR50XQ5Rlox/B1jvaAwaI7TuR/OWlx6k/I9gKCU4RoZS7hJrfMcBT
      PHX_SERVER: "true"
      PORT: "4000"
      POOL_SIZE: "10"
      LOG_LEVEL: info
      # The agent's registration token; both sides read it from here.
      EX_GOCD_DEMO_COOKIE: ex-gocd-demo-cookie
      # Open mode: no admin user, so nobody logs in.
      EX_GOCD_SKIP_USER_SEED: "1"
      # Not USE_MOCK_DATA: that mocks the agents too, and the point of this stack
      # is the real agent below picking up real work.
    command:
      - /bin/sh
      - -lc
      - |
        /app/bin/ex_gocd eval "ExGoCD.Release.migrate()" &&
        /app/bin/ex_gocd eval "ExGoCD.Release.seed()" &&
        exec /app/bin/ex_gocd start
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/go/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  # The agent variants published from this repository (see
  # `.github/workflows/elixir.yml`): each carries the toolchains its name says.
  # A pipeline asks for a resource and the agent that has it takes the job, so a
  # fleet runs several pipelines at once instead of one agent walking through
  # them. `docker` is deliberately nobody's resource — no variant can run docker,
  # and an agent that advertises what it cannot deliver gets the job and fails it.
  agent-elixir:
    image: ghcr.io/d-led/ex_gocd-agent:rust-elixir
    depends_on:
      server:
        condition: service_healthy
    environment:
      AGENT_SERVER_URL: http://server:4000
      EX_GOCD_DEMO_COOKIE: ex-gocd-demo-cookie
      AGENT_AUTO_REGISTER_RESOURCES: elixir,erlang,rust,postgres
      AGENT_WORK_DIR: /agent-work/elixir
    volumes:
      - agent-work:/agent-work

  agent-go:
    image: ghcr.io/d-led/ex_gocd-agent:golang
    depends_on:
      server:
        condition: service_healthy
    environment:
      AGENT_SERVER_URL: http://server:4000
      EX_GOCD_DEMO_COOKIE: ex-gocd-demo-cookie
      AGENT_AUTO_REGISTER_RESOURCES: go,golang
      AGENT_WORK_DIR: /agent-work/go
    volumes:
      - agent-work:/agent-work

  agent-node:
    image: ghcr.io/d-led/ex_gocd-agent:standard
    depends_on:
      server:
        condition: service_healthy
    environment:
      AGENT_SERVER_URL: http://server:4000
      EX_GOCD_DEMO_COOKIE: ex-gocd-demo-cookie
      AGENT_AUTO_REGISTER_RESOURCES: node,nodejs,python
      AGENT_WORK_DIR: /agent-work/node
    volumes:
      - agent-work:/agent-work

  # Opt in with `docker compose --profile docker up`: this agent carries the
  # docker CLI and gets the host's daemon socket, so the demo's dogfood docker
  # jobs (`docker info`, `docker run alpine echo`) run instead of waiting.
  #
  # Read this before enabling it: the socket is the daemon. Anything running in
  # this agent can start a container as root on your machine, which is what CI
  # already does and is not what everyone wants on a laptop.
  agent-docker:
    image: ghcr.io/d-led/ex_gocd-agent:full
    profiles: ["docker"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      AGENT_SERVER_URL: http://server:4000
      EX_GOCD_DEMO_COOKIE: ex-gocd-demo-cookie
      AGENT_AUTO_REGISTER_RESOURCES: docker
      AGENT_WORK_DIR: /agent-work/docker
    volumes:
      - agent-work:/agent-work
      # DOCKER_SOCKET overrides the path for a setup that keeps the daemon
      # somewhere else (Docker Desktop on macOS: ~/.docker/run/docker.sock).
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"

volumes:
  db:
  agent-work:
