name: Build Managed Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to build (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - corp_policy
          - enterprise_hierarchy
          - sample_scheduling_plugin
          - simple_org_chart
        default: 'all'
      push:
        description: 'Push image to ghcr.io?'
        required: false
        type: boolean
        default: false
      variant:
        description: 'Image variant'
        required: false
        type: choice
        options:
          - both
          - git
          - full
        default: 'both'
  push:
    paths:
      - 'plugins/managed/**/Dockerfile'
      - '.github/workflows/build-plugins.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ex_gocd

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          - corp_policy
          - enterprise_hierarchy
          - sample_scheduling_plugin
          - simple_org_chart
        variant:
          - git
          - full
    steps:
      - name: Determine plugins to build
        id: filter
        env:
          INPUT: ${{ github.event.inputs.plugin || 'all' }}
          INPUT_VARIANT: ${{ github.event.inputs.variant || 'both' }}
          INPUT_PUSH: ${{ github.event.inputs.push || 'false' }}
        run: |
          MATRIX="${{ matrix.plugin }}"
          MATRIX_VARIANT="${{ matrix.variant }}"

          VARIANT_MATCH=false
          if [ "$INPUT_VARIANT" = "both" ] || [ "$INPUT_VARIANT" = "$MATRIX_VARIANT" ]; then
            VARIANT_MATCH=true
          fi

          PLUGIN_MATCH=false
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "$MATRIX" ]; then
            PLUGIN_MATCH=true
          fi

          if [ "$PLUGIN_MATCH" = "true" ] && [ "$VARIANT_MATCH" = "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "should_push=${INPUT_PUSH}" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.build == 'true'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.filter.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build plugin image (${{ matrix.variant }})
        if: steps.filter.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: plugins/managed/${{ matrix.plugin }}
          build-args: VARIANT=${{ matrix.variant }}
          load: ${{ steps.filter.outputs.should_push != 'true' }}
          push: ${{ steps.filter.outputs.should_push == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-plugin-${{ matrix.plugin }}:${{ matrix.variant }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
