name: Build Managed Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to build'
        required: false
        type: choice
        options:
          - all
          - corp_policy
          - enterprise_hierarchy
          - sample_scheduling_plugin
          - simple_org_chart
        default: 'all'
  push:
    paths:
      - 'plugins/managed/**/Dockerfile'
      - '.github/workflows/build-plugins.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ex_gocd

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          - corp_policy
          - enterprise_hierarchy
          - sample_scheduling_plugin
          - simple_org_chart
    steps:
      - name: Determine plugins to build
        id: filter
        env:
          INPUT: ${{ github.event.inputs.plugin || 'all' }}
        run: |
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "${{ matrix.plugin }}" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.build == 'true'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.filter.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push plugin image
        if: steps.filter.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: plugins/managed/${{ matrix.plugin }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-plugin-${{ matrix.plugin }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-plugin-${{ matrix.plugin }}:${{ matrix.variant }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
