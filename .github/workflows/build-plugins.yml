name: Build Managed Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to build (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - corp_policy
          - enterprise_hierarchy
          - sample_scheduling_plugin
          - simple_org_chart
        default: 'all'
      push:
        description: 'Push image to ghcr.io?'
        required: false
        type: boolean
        default: false
      variant:
        description: 'Image variant'
        required: false
        type: choice
        options:
          - both
          - git
          - full
        default: 'both'
  push:
    paths:
      - 'plugins/managed/**/Dockerfile'
      - '.github/workflows/build-plugins.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ex_gocd

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          - corp_policy
          - enterprise_hierarchy
          - sample_scheduling_plugin
          - simple_org_chart
        variant:
          - git
          - full
    steps:
      - name: Determine plugins to build
        id: filter
        run: |
          INPUT="${{ github.event.inputs.plugin }}"
          INPUT_VARIANT="${{ github.event.inputs.variant }}"
          MATRIX="${{ matrix.plugin }}"
          MATRIX_VARIANT="${{ matrix.variant }}"
          if [ "$INPUT_VARIANT" = "both" ] || [ "$INPUT_VARIANT" = "" ] || [ "$INPUT_VARIANT" = "$MATRIX_VARIANT" ]; then
            MATCH_VARIANT=true
          else
            MATCH_VARIANT=false
          fi
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "" ] || [ "$INPUT" = "$MATRIX" ]; then
            MATCH_PLUGIN=true
          else
            MATCH_PLUGIN=false
          fi
          if [ "$MATCH_PLUGIN" = "true" ] && [ "$MATCH_VARIANT" = "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.build == 'true'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.filter.outputs.build == 'true' && (github.event.inputs.push == 'true' || github.event_name == 'push')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build plugin image (${{ matrix.variant }})
        if: steps.filter.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: plugins/managed/${{ matrix.plugin }}
          build-args: VARIANT=${{ matrix.variant }}
          load: ${{ github.event.inputs.push != 'true' }}
          push: ${{ github.event.inputs.push == 'true' || github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-plugin-${{ matrix.plugin }}:${{ matrix.variant }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
